<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>uni-sdk — browser trusted-token example</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
      input, button { font: inherit; padding: 0.4rem 0.6rem; }
      input { width: 100%; box-sizing: border-box; margin: 0.25rem 0 0.75rem; }
      #status { color: #666; font-size: 0.85rem; }
      #reply { white-space: pre-wrap; background: #f5f5f5; padding: 1rem; border-radius: 6px; min-height: 3rem; }
    </style>
  </head>
  <body>
    <h1>Trusted-token chat</h1>
    <p id="status">session: (not connected)</p>

    <label for="token">Host-supplied access token</label>
    <input id="token" type="password" placeholder="paste a token issued by the host (e.g. UnifiedApp broker)" />
    <button id="connect">Connect</button>

    <hr />

    <label for="prompt">Prompt</label>
    <input id="prompt" value="Say hello in one short sentence." />
    <button id="send" disabled>Send</button>

    <h2>Reply</h2>
    <pre id="reply">(nothing yet)</pre>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
